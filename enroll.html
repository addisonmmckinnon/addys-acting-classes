<!DOCTYPE html>

<head>

</head>
<body>

  <header class="site-header">
    <div class="nav-inner">
      <a class="site-title" href="index.html">🎭 Addy's Performing Arts Classes</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>

        <a href="safety.html">Safety</a>
        <a href="enroll.html">Enroll</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="enroll">
      <h1>Enroll in a Class 🎟️</h1>
      <p class="intro">
        Fill this out and I'll get back to you about signing up!
      </p>

      <!--
        Addy: this form emails addisonmmckinnon@gmail.com via FormSubmit
        (a free service, no account needed) — the AT&T text gateway wasn't
        delivering reliably, so this sends to your real email instead. The
        FIRST submission triggers a one-time confirmation email with a
        link — tap it once to activate, then every submission after that
        emails you automatically. Turn on notifications for Mail on your
        phone if you want it to feel like a text.
      -->
      <form action="https://formsubmit.co/addisonmmckinnon@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New Class Enrollment!" />
        <input type="hidden" name="_captcha" value="false" />
        <div>
          <label for="name">Student's Name</label><br />
          <input type="text" id="name" name="name" required />
        </div>

        <div>
          <label for="age">Student's Age</label><br />
          <input type="number" id="age" name="age" min="0" max="120" required />
        </div>

        <div>
          <label for="allergies">Allergies (if any)</label><br />
          <input type="text" id="allergies" name="allergies" placeholder="e.g. peanuts, none" />
        </div>

        <div>
          <label for="parent">Parent/Guardian Name</label><br />
          <input type="text" id="parent" name="parent" />
        </div>

        <div>
          <label for="email">Email</label><br />
          <input type="email" id="email" name="email" required />
        </div>

        <div>
          <label for="class">Which class?</label><br />
          <select id="class" name="class">
            <option value="acting">🎭 Acting</option>
            <option value="singing">🎤 Singing</option>
            <option value="drama">🎬 Drama</option>
            <option value="musical">🎶 Musical Theatre</option>
          </select>
        </div>

        <div>
          <label for="message">Anything else I should know?</label><br />
          <textarea id="message" name="message"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 Addy's Performing Arts Classes 🎭
  </footer>

</body>
</html>
